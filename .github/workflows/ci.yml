name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: pip install pytest
      - name: Compile check
        run: python -m py_compile vision.py config.py media_formats.py media.py ollama_client.py video_plans.py extras/sources.py extras/speech.py extras/mcp_server.py extras/capture.py extras/vram_watchdog.py scripts/generate_adapters.py
      - name: Shell syntax check (Linux)
        if: runner.os == 'Linux'
        run: bash -n scripts/setup.sh
      - name: PowerShell syntax check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('scripts/setup.ps1', 'extras/vram-watchdog.ps1')
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $f, $_.Message) }
              exit 1
            }
          }
      - name: Unit tests
        run: python -m pytest tests/ -v
      - name: Packaging smoke test
        run: |
          python -m pip install build
          python -m build --outdir dist
          pip install .
          vision --version
          vision-adapters --help
