name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
      - name: Install locked test dependencies
        run: uv sync --locked --extra test
      - name: Lint with ruff
        run: uv run ruff check . --no-cache

  unit-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
      - name: Install locked test dependencies
        run: uv sync --locked --extra test
      - name: Compile check
        run: uv run python -m py_compile vision.py config.py media_formats.py media.py ollama_client.py service.py video_plans.py extras/sources.py extras/speech.py extras/mcp_server.py extras/capture.py extras/vram_watchdog.py scripts/generate_adapters.py
      - name: Shell syntax check (Linux)
        if: runner.os == 'Linux'
        run: bash -n scripts/setup.sh
      - name: PowerShell syntax check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('scripts/setup.ps1', 'extras/vram-watchdog.ps1')
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $f, $_.Message) }
              exit 1
            }
          }
      - name: Unit tests
        run: uv run python -m pytest tests -q -p no:cacheprovider

  packaging:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project test dependencies
        run: python -m pip install ".[test]"
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install the real wheel in a clean venv
        run: |
          python -m venv .venv-package
          .venv-package/bin/python -m pip install dist/*.whl --no-deps
          .venv-package/bin/vision --version
          .venv-package/bin/vision-mcp --help
          .venv-package/bin/vision-adapters --help
